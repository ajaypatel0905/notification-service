spring:
  application:
    name: notification-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notify}
    username: ${DATABASE_USER:notify}
    password: ${DATABASE_PASSWORD:notify}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

notify:
  security:
    # Platform-admin key that bootstraps the system. Override in every real environment.
    bootstrap-admin-key: ${NOTIFY_ADMIN_KEY:}
    callback-secret: ${NOTIFY_CALLBACK_SECRET:change-me-callback-secret}
  dispatch:
    enabled: true
    poll-interval-ms: 200
    claim-batch-per-tenant: 20
    lease-duration: 60s
    lease-reaper-interval-ms: 15000
    schedule-promoter-interval-ms: 1000
    pools:
      EMAIL: 8
      SMS: 8
      PUSH: 8
      IN_APP: 4
    queue-capacity-per-pool: 200
  retry:
    initial-backoff: 1s
    multiplier: 2.0
    max-backoff: 5m
  providers:
    simulated:
      latency-ms: 5
      transient-failure-rate: 0.0
      permanent-failure-rate: 0.0
      auto-callback: true
      auto-callback-delay-ms: 200
